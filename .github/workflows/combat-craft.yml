name: Combat craft validation
on:
  push:
    branches: [feat/combat-craft]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: combat-craft-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fixed source checks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run test:upstream
          npm run build
          mkdir -p /tmp/craft-${{ matrix.os }}
          git rev-parse HEAD > /tmp/craft-${{ matrix.os }}/commit.txt
          cp docs/evidence/combat-craft-local.json /tmp/craft-${{ matrix.os }}/local-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: craft-${{ matrix.os }}
          path: /tmp/craft-${{ matrix.os }}/
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Desktop spectator smoke test
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
          python scripts/check-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: craft-browser
          path: outputs/browser/
          retention-days: 7
