name: Publish tested combat craft
on:
  push:
    branches: [feat/combat-craft-verified]
    paths: ['.delivery/**', '.github/workflows/publish-combat-craft.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  publish:
    if: github.repository == 'hugeJan/arena-combat' && github.ref == 'refs/heads/feat/combat-craft-verified' && github.event.head_commit.message == 'Stage tested combat craft implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact reviewed source
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          root=pathlib.Path.cwd();m=json.loads((root/'.delivery/craft-manifest.json').read_text())
          base='973755a5e2494d2c95473d17619c6d7edccb8f0f'
          assert m['base']==base
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()=='495eedf2d554ae3d99575dabad3f447844f10652'
          assert subprocess.check_output(['git','rev-parse','HEAD^^'],text=True).strip()==base
          encoded=''.join((root/f'.delivery/craft.{i}.b64').read_text() for i in range(4))
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()==m['compressed_sha256']
          patch=lzma.decompress(compressed,memlimit=256*1024**2)
          assert len(patch)<1024**2 and hashlib.sha256(patch).hexdigest()==m['patch_sha256']
          p=pathlib.Path('/tmp/craft.patch');p.write_bytes(patch)
          assert len(m['files'])==34
          for name in m['files']:
              assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
              assert not name.startswith(('vendor/','.github/','.git/'))
          changed=subprocess.check_output(['git','apply','--numstat',str(p)],text=True)
          assert {line.split('\t',2)[2] for line in changed.splitlines()}==set(m['files'])
          subprocess.run(['git','apply','--check',str(p)],check=True)
          subprocess.run(['git','apply',str(p)],check=True)
          for name,digest in m['files'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==digest,name
          PY
      - name: Test before publishing
        run: |
          mkdir -p /tmp/craft-checks
          npm ci --ignore-scripts --no-audit --no-fund
          npm test | tee /tmp/craft-checks/tests.txt
          npm run test:upstream | tee /tmp/craft-checks/upstream.txt
          npm run build | tee /tmp/craft-checks/build.txt
      - name: Publish verified files without rewriting history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd();m=json.loads((root/'.delivery/craft-manifest.json').read_text())
          additions=[]
          for name,digest in m['files'].items():
              b=(root/name).read_bytes();assert hashlib.sha256(b).hexdigest()==digest,name
              additions.append({'path':name,'contents':base64.b64encode(b).decode()})
          query='mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}'
          variables={'input':{'branch':{'repositoryNameWithOwner':'hugeJan/arena-combat','branchName':'feat/combat-craft-verified'},'expectedHeadOid':os.environ['GITHUB_SHA'],'message':{'headline':'Implement committed swordcraft and desktop spectator arena'},'fileChanges':{'additions':additions,'deletions':[{'path':f'.delivery/craft.{i}.b64'} for i in range(4)]+[{'path':'.delivery/craft-manifest.json'}]}}}
          p=pathlib.Path('/tmp/craft-commit.json');p.write_text(json.dumps({'query':query,'variables':variables}))
          response=json.loads(subprocess.check_output(['gh','api','graphql','--input',str(p)],text=True))
          assert 'errors' not in response,response.get('errors')
          commit=response['data']['createCommitOnBranch']['commit'];print(json.dumps(commit))
          pathlib.Path('/tmp/craft-checks/published-commit.txt').write_text(commit['oid']+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: craft-publish-checks
          path: /tmp/craft-checks/
          retention-days: 7
